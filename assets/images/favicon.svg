<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- AI Neural / V Glyph -->
  <path d="M 28 32 L 50 72 L 72 32" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Neural Nodes -->
  <circle cx="28" cy="32" r="5" fill="#06b6d4" />
  <circle cx="72" cy="32" r="5" fill="#8b5cf6" />
  <circle cx="50" cy="72" r="6" fill="#3b82f6" />
  <circle cx="50" cy="42" r="3" fill="#ffffff" />
  <line x1="28" y1="32" x2="50" y2="42" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" opacity="0.8" />
  <line x1="72" y1="32" x2="50" y2="42" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 2" opacity="0.8" />
  <line x1="50" y1="42" x2="50" y2="72" stroke="#3b82f6" stroke-width="2" opacity="0.8" />
</svg>
